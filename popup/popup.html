<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Attendance Eshtu?</h1>
        <div id="attendanceDiv" class="section">
            <span class="sectionTitle">Attendance</span>
            <div id="fetchFailDiv">
                Values are not saved.<br>
                Go to the <a href="https://kp.christuniversity.in/KnowledgePro/studentWiseAttendanceSummary.do?method=getIndividualStudentWiseSubjectAndActivityAttendanceSummary">attendance page</a>
                to save values.
            </div>
            <div id="attendanceInnerDiv">
                <table>
                    <tr>
                        <th>Attendance<br>without claims</th>
                        <td><span id="attendanceWithoutClaims"></span>%</td>
                    </tr>
                    <tr>
                        <th>Attendance<br>with claims</th>
                        <td><span id="attendanceWithClaims"></span>%</td>
                    </tr>
                    <tr>
                        <th>Last updated</th>
                        <td>
                            <span id="lastUpdatedDate"></span>,<br>
                            <span id="lastUpdatedTime"></span>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
        <br>
        <div id="autofillDiv" class="section">
            <span class="sectionTitle">Autofill</span>
            <div>
                <label>
                    <input type="checkbox" id="showFill">
                    Show fill button
                </label>
                <br>
                <div id="loginCredentialsDiv">
                    <label>Reg. No.</label><br>
                    <input type="text" id="regNoInput" placeholder="">
                    <br>
                    <label>Password</label><br>
                    <input type="password" id="passwordInput" placeholder="">
                    <br>
                    <div id="buttonsDiv">
                        <div id="saveLoginCredentials" class="button" title="Save">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" style="height: 17px;">
                                <path d="M160 96C124.7 96 96 124.7 96 160L96 480C96 515.3 124.7 544 160 544L480 544C515.3 544 544 515.3 544 480L544 237.3C544 220.3 537.3 204 525.3 192L448 114.7C436 102.7 419.7 96 402.7 96L160 96zM192 192C192 174.3 206.3 160 224 160L384 160C401.7 160 416 174.3 416 192L416 256C416 273.7 401.7 288 384 288L224 288C206.3 288 192 273.7 192 256L192 192zM320 352C355.3 352 384 380.7 384 416C384 451.3 355.3 480 320 480C284.7 480 256 451.3 256 416C256 380.7 284.7 352 320 352z"/>
                            </svg>
                        </div>
                        <div id="savedMessage">Saved!</div>
                        <div id="clearButton" class="button" style="margin-left: auto;" title="Clear">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" style="height: 17px;">
                                <path d="M576 192C576 156.7 547.3 128 512 128L205.3 128C188.3 128 172 134.7 160 146.7L9.4 297.4C3.4 303.4 0 311.5 0 320C0 328.5 3.4 336.6 9.4 342.6L160 493.3C172 505.3 188.3 512 205.3 512L512 512C547.3 512 576 483.3 576 448L576 192zM284.1 252.1C293.5 242.7 308.7 242.7 318 252.1L351.9 286L385.8 252.1C395.2 242.7 410.4 242.7 419.7 252.1C429 261.5 429.1 276.7 419.7 286L385.8 319.9L419.7 353.8C429.1 363.2 429.1 378.4 419.7 387.7C410.3 397 395.1 397.1 385.8 387.7L351.9 353.8L318 387.7C308.6 397.1 293.4 397.1 284.1 387.7C274.8 378.3 274.7 363.1 284.1 353.8L318 319.9L284.1 286C274.7 276.6 274.7 261.4 284.1 252.1z"/>
                            </svg>
                        </div>
                    </div>
                    <label>
                        <input type="checkbox" id="solveCaptchaCheckbox">
                        Solve captcha (unreliable)
                    </label>
                </div>
            </div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
